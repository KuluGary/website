name: Create Kit newsletter drafts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kit-newsletter-drafts
  cancel-in-progress: false

jobs:
  create-drafts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Kit drafts
        run: npm run newsletter:drafts
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
