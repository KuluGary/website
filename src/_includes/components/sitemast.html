<header id="sitemast" role="banner">
	<picture>
		<source class="pixelated" media="(prefers-color-scheme: dark)" srcset="/assets/images/header-dark.gif">
		<source class="pixelated" media="(prefers-color-scheme: light)" srcset="/assets/images/header-light.gif">
		<img class="pixelated" src="/assets/images/header-light.png" alt="" >
	</picture>
	<p class="heading-1">
		<a href="/">{{ metadata.title }}</a>
	</p>
</header>
